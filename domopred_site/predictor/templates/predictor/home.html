<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DomoPred - Prédicteur de prix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">DomoPred</a>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 mb-3">Prédire le prix d'un appartement</h1>

              {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
              {% endif %}

              <form method="post" action="{% url 'predict' %}">
                {% csrf_token %}
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Localité</label>
                    <select class="form-select" name="location" required>
                      <option value="" disabled selected>Choisir...</option>
                      {% for loc in locations %}
                        <option value="{{ loc }}">{{ loc }}</option>
                      {% endfor %}
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Superficie totale (sqft)</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="total_sqft" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Salles de bain</label>
                    <input type="number" min="0" class="form-control" name="bath" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Balcons</label>
                    <input type="number" min="0" class="form-control" name="balcony" required />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Chambres</label>
                    <input type="number" min="0" class="form-control" name="bedrooms" required />
                  </div>
                </div>
                <div class="mt-4 d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">Prédire</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="text-center py-4 text-muted">&copy; {{ now|default:2025 }} DomoPred</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
